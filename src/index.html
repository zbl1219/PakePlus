<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>商会会员撮合系统</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap">
<script>
/* 图表组件改为按需动态加载，避免外部网络阻塞页面渲染 */
window.__echartsScript='https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#16233B;--navy-2:#1B3A6B;--navy-3:#24508F;
  --gold:#B8934A;--gold-2:#C9A96A;--gold-soft:#F3EBDD;
  --bg:#F3F5F9;--card:#FFFFFF;--line:#E3E8F0;
  --text:#1F2A3D;--muted:#66748A;
  --ok:#1F7A4D;--ok-bg:#E7F4EC;--warn:#B5472F;--warn-bg:#FDEBEA;--info-bg:#EAF1FA;
  --r:10px;
}
html,body{height:100%}
body{font-family:"Noto Sans SC",system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--navy-3);text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::placeholder{color:#A6B0C0}

/* ===== 通用组件 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:8px;padding:9px 16px;font-size:13.5px;font-weight:600;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--navy-2);color:#fff}
.btn-primary:hover{background:var(--navy-3)}
.btn-gold{background:var(--gold);color:#fff}
.btn-gold:hover{background:#A47F39}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--navy-3);color:var(--navy-3)}
.btn-danger{background:#fff;border-color:#E8C9C2;color:var(--warn)}
.btn-danger:hover{background:var(--warn-bg)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
.btn-block{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.6}
.badge-demand{background:var(--warn-bg);color:var(--warn)}
.badge-supply{background:var(--ok-bg);color:var(--ok)}
.badge-active{background:var(--ok-bg);color:var(--ok)}
.badge-pending{background:#FDF3DD;color:#9A6B14}
.badge-disabled{background:#EEF1F5;color:#7B8798}
.badge-off{background:#EEF1F5;color:#7B8798}
.badge-invalid{background:#EEF1F5;color:#7B8798}
.badge-admin{background:var(--gold-soft);color:#8A6A2E}
.tag{display:inline-block;background:var(--info-bg);color:var(--navy-3);font-size:12px;padding:1px 8px;border-radius:5px;margin:2px 4px 2px 0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:16px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel .sub{font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted)}
.small{font-size:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:880px}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 12px;background:#F7F9FC;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid #EEF1F6;vertical-align:middle}
.tbl .tc{text-align:center;white-space:nowrap}
.tbl .tc-wrap{text-align:center;white-space:normal;min-width:150px;max-width:220px;word-break:break-all;line-height:1.55}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:#FAFBFD}
.empty{padding:38px 16px;text-align:center;color:var(--muted);font-size:13.5px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;transition:border-color .15s,box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold-2);box-shadow:0 0 0 3px rgba(184,147,74,.14)}
.field textarea{resize:vertical;min-height:76px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
@media(max-width:720px){.fgrid{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}

/* ===== 登录页 ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:
  radial-gradient(900px 480px at 85% -10%,rgba(36,80,143,.55),transparent 60%),
  radial-gradient(700px 420px at -10% 110%,rgba(184,147,74,.28),transparent 60%),
  linear-gradient(140deg,#101C31 0%,#16233B 45%,#1B3A6B 100%)}
.login-card{width:408px;max-width:100%;background:#fff;border-radius:16px;padding:34px 34px 26px;box-shadow:0 24px 60px rgba(8,16,32,.35);position:relative;z-index:2}
.login-stars{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.login-stars .star{position:absolute;border-radius:50%;background:#fff;animation:starDrift var(--dt,26s) ease-in-out infinite alternate,starTwinkle var(--tw,3.2s) ease-in-out infinite}
.login-stars .star.s-gold{background:#FFE3A3}
@keyframes starTwinkle{0%,100%{opacity:.12}45%{opacity:1}55%{opacity:.85}}
@keyframes starDrift{
  0%{transform:translate(0,0)}
  40%{transform:translate(var(--dx,30px),var(--dy,-20px))}
  70%{transform:translate(calc(var(--dx,30px)*-.5),calc(var(--dy,-20px)*-.4))}
  100%{transform:translate(calc(var(--dx,30px)*.2),calc(var(--dy,-20px)*.5))}
}
@media(prefers-reduced-motion:reduce){.login-stars .star{animation:starTwinkle calc(var(--tw,3.2s)*2.5) ease-in-out infinite}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.logo{width:44px;height:44px;border-radius:11px;background:linear-gradient(140deg,var(--gold),#9A7834);color:#fff;font-size:23px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 6px 16px rgba(184,147,74,.35)}
.brand .t1{font-size:19px;font-weight:900;letter-spacing:.5px;color:var(--navy)}
.brand .t2{font-size:12px;color:var(--muted);margin-top:1px}
.login-sub{margin:14px 0 18px;padding:11px 13px;background:var(--gold-soft);border-radius:8px;color:#7C6230;font-size:12.5px;line-height:1.6}
.login-sub b{color:#5F4A1E}
.demo-box{margin-top:16px;border:1px dashed var(--line);border-radius:9px;padding:12px 13px;font-size:12.5px;color:var(--muted);background:#FAFBFD}
.demo-box .dh{font-weight:700;color:var(--text);margin-bottom:6px}
.demo-box code{background:#EEF1F5;border-radius:4px;padding:1px 6px;font-size:12px;color:var(--navy-2)}
.demo-box .row{margin-top:8px}
.login-foot{margin-top:16px;display:flex;align-items:center;justify-content:space-between;font-size:13px}
.privacy-note{margin-top:14px;text-align:center;font-size:11.5px;color:#8A94A6}

/* ===== 应用布局 ===== */
.layout{display:flex;min-height:100vh}
.sidebar{width:232px;flex:none;background:var(--navy);color:#B9C6DC;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
.sidebar .sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar .sb-brand .logo{width:36px;height:36px;font-size:18px;border-radius:9px}
.sidebar .sb-brand .t1{color:#fff;font-size:15.5px;font-weight:800;letter-spacing:.4px;line-height:1.3}
.sidebar .sb-brand .t2{font-size:11px;color:#8FA0BC}
.sb-nav{flex:1;overflow-y:auto;padding:12px 0 20px}
.sb-nav .nav-title{padding:14px 20px 6px;font-size:11px;letter-spacing:1px;color:#6E7F9C;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 20px;color:#AEBBD2;font-size:13.5px;cursor:pointer;border-left:3px solid transparent;transition:background .15s,color .15s}
.nav-item svg{flex:none;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.05);color:#E4EAF3}
.nav-item.active{background:rgba(255,255,255,.07);color:#fff;border-left-color:var(--gold);font-weight:700}
.nav-badge{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E5484D;color:#fff;font-size:11px;font-weight:700;line-height:1;box-shadow:0 1px 4px rgba(229,72,77,.45);animation:badgePop .3s ease}
@keyframes badgePop{0%{transform:scale(.4)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.sb-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:#7C8CA8;display:flex;align-items:center;gap:8px}
.main{margin-left:232px;flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:40}
.topbar .pg{font-size:16px;font-weight:800;color:var(--navy)}
.topbar .who{display:flex;align-items:center;gap:10px}
.topbar .who .nm{font-weight:700;font-size:13.5px}
.menu-btn{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center}
.content{padding:22px;width:100%;max-width:1180px;margin:0 auto}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,18,33,.45);z-index:55}
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(0,0,0,.35)}
  .main{margin-left:0}
  .menu-btn{display:inline-flex}
  .overlay.show{display:block}
  .content{padding:14px}
  .trial-tag{display:none}
}

/* ===== 统计卡片 ===== */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card .num{font-size:27px;font-weight:900;color:var(--navy-2);line-height:1.15}
.stat-card .num.gold{color:#9A7834}
.stat-card .lbl{font-size:12.5px;color:var(--muted);margin-top:3px}
.stat-card .ic{position:absolute;right:14px;top:14px;opacity:.16}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.chart-box{height:280px;width:100%}
.chart-box.full{height:240px}

/* ===== 信息卡片 ===== */
.post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.post-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:9px;transition:box-shadow .15s,border-color .15s}
.post-card:hover{box-shadow:0 6px 18px rgba(22,35,59,.08)}
.post-card .pt{font-weight:700;font-size:15px;line-height:1.45}
.post-card .desc{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.post-card .meta{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);border-top:1px solid #F0F2F7;padding-top:9px}
.pub-line{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.pub-line svg{flex:none}

/* ===== 撮合记录 ===== */
.match-item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid #EEF1F6;flex-wrap:wrap}
.match-item:last-child{border-bottom:none}
.match-side{flex:1;min-width:210px}
.match-side .role{font-size:11.5px;color:var(--muted);margin-bottom:2px}
.match-side .who{font-weight:800;font-size:14.5px;color:var(--navy-2)}
.match-side .what{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.match-arrow{color:var(--gold);flex:none}
.match-info{flex:none;text-align:right;font-size:12px;color:var(--muted)}
.match-info .sc{font-weight:800;color:#9A7834;font-size:14px}
.match-actions{width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:12px;margin-top:8px;border-top:1px dashed #E4E9F2}
.contact-grant{width:100%;background:var(--ok-bg);border:1px solid #C9E8D8;border-radius:10px;padding:10px 12px;font-size:13px;color:#14532D;line-height:1.8}
.contract-doc{border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:13.5px;line-height:1.8;color:var(--text)}
.contract-doc .ct-title{text-align:center;font-size:17px;font-weight:800;letter-spacing:1px}
.contract-doc .ct-no{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:14px}
.contract-doc .ct-block{margin-top:12px}
.contract-doc .ct-block b{color:var(--navy-2)}
.contract-doc .ct-clause{margin:6px 0 0;padding:0;list-style:none}
.contract-doc .ct-clause li{padding:2px 0;color:#44506B}
.contract-doc .ct-sign{margin-top:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px}
.contract-doc .ct-seal{text-align:center;margin-top:18px;padding-top:12px;border-top:1px dashed var(--line);color:var(--muted);font-size:12.5px}
.bk-card{background:#FAFBFD;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.bk-t{font-weight:800;font-size:15px;margin-bottom:6px;color:var(--navy-2)}
.bk-d{font-size:12.5px;color:var(--muted);line-height:1.7;margin-bottom:12px}
.bk-note{margin-top:14px;background:var(--gold-soft);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#7C6230;line-height:1.7;display:flex;gap:8px;align-items:flex-start}
.bk-sum{background:#F7F9FC;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.8}
.del-warn{background:#FDF2F2;border:1px solid #F5C6C6;border-radius:10px;padding:14px 16px;font-size:14px;color:#B3261E;line-height:1.7;display:flex;gap:8px;align-items:flex-start;font-weight:600}
.trial-note{margin:0 0 14px;background:#FDF2F2;border:1px solid #F5C6C6;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#B3261E;line-height:1.7;display:flex;gap:8px;align-items:flex-start}
.trial-line{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
.trial-tag{font-size:11.5px;color:#7C6230;border:1px solid #E4D5AE;background:#FBF6E9;border-radius:999px;padding:3px 10px;white-space:nowrap}
.fb-bar{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.fb-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-width:0}
.fb-col .fb-v{font-size:11px;color:var(--muted)}
.fb-col .fb-b{width:70%;background:var(--navy-3);border-radius:5px 5px 0 0;min-height:2px}
.fb-col .fb-l{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ===== 弹窗 / Toast ===== */
.modal-mask{position:fixed;inset:0;background:rgba(10,18,33,.46);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:#fff;border-radius:14px;width:min(560px,94vw);max-height:88vh;overflow:auto;padding:24px 26px;box-shadow:0 24px 70px rgba(8,16,32,.35)}
.modal h3{font-size:16px;font-weight:800;margin-bottom:16px;color:var(--navy)}
.modal .close-x{float:right;border:none;background:none;font-size:20px;color:var(--muted);line-height:1;padding:2px 6px;border-radius:6px}
.modal .close-x:hover{background:#F1F3F8;color:var(--text)}
#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast-item{background:#1F2A3D;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;box-shadow:0 10px 30px rgba(10,18,33,.3);opacity:0;transition:opacity .2s;max-width:88vw}
.toast-item.show{opacity:1}
.toast-item.err{background:#8A3322}
.toast-item.ok{background:#176A44}
.dl{display:grid;grid-template-columns:110px 1fr;row-gap:9px;font-size:13.5px}
.dl dt{color:var(--muted)}
.dl dd{font-weight:600;word-break:break-all}
.kv-strong{font-weight:800;color:var(--navy-2)}

/* ========== 安卓手机版适配（360×800dp） ========== */
@media(max-width:480px){
  body{font-size:14px}
  /* 顶栏 */
  .topbar{height:56px;padding:0 10px;gap:8px}
  .topbar .pg{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .topbar .who{flex:none;gap:8px}
  .topbar .who .nm{font-size:13px}
  .topbar .who .badge{display:none}
  .topbar .btn-sm{padding:6px 9px;font-size:12px;min-height:32px}
  /* 侧栏抽屉 */
  .sidebar{width:min(78vw,300px)}
  .sb-brand{padding:16px 16px 14px}
  .sb-brand .t1{font-size:15px}
  .sb-nav .nav-title{padding:12px 16px 6px;font-size:11.5px}
  .sb-nav .nav-item{padding:13px 16px;font-size:14px}
  .sb-foot{padding:12px 16px;font-size:12px}
  /* 内容与面板 */
  .content{padding:12px}
  .panel{padding:14px;margin-top:12px;border-radius:12px}
  .panel h3{font-size:15px;margin-bottom:12px;flex-wrap:wrap;line-height:1.5}
  .panel h3 .sub{font-size:11.5px}
  /* 统计卡片两列 */
  .stat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .stat-card{padding:13px 14px}
  .stat-card .num{font-size:22px}
  .stat-card .lbl{font-size:12px}
  .chart-box{height:220px}
  .chart-box.full{height:200px}
  /* 表单大触控区 */
  .field{margin-bottom:12px}
  .field label{font-size:13px}
  .field input,.field select,.field textarea{min-height:44px;font-size:15px;padding:10px 12px;border-radius:9px}
  .btn{min-height:42px;padding:8px 14px;font-size:14px;border-radius:9px}
  .btn-sm{min-height:34px;padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn-block{min-height:46px;font-size:15px}
  .form-actions{display:flex;gap:8px;flex-wrap:wrap}
  .form-actions .btn{flex:1;min-width:0;margin:0}
  /* 表格：保持可横向滑动 */
  table.tbl{font-size:12.5px;min-width:720px}
  .tbl th{padding:8px 8px;font-size:11.5px}
  .tbl td{padding:9px 8px}
  .tbl .tc-wrap{min-width:120px;max-width:170px}
  .empty{padding:28px 12px;font-size:13px}
  /* 弹窗：底部抽屉式 */
  .modal-mask{padding:10px;align-items:flex-end}
  .modal{width:100%;max-height:86vh;border-radius:16px 16px 0 0;padding:18px 16px}
  .modal h3{font-size:15px}
  .dl{grid-template-columns:92px 1fr;font-size:13px;row-gap:10px}
  /* 登录/注册 */
  .login-card{width:calc(100% - 32px);padding:24px 18px 20px;border-radius:16px}
  .login-card .brand .t1{font-size:17px}
  .login-card .brand .t2{font-size:11.5px}
  .login-card .field input{min-height:46px;font-size:15px}
  .login-card .btn{min-height:46px;font-size:15px}
  .login-sub{font-size:12.5px;padding:10px 11px}
  .login-foot{font-size:13px}
  .trial-line{font-size:12px;margin-top:12px}
  .trial-note{font-size:12.5px}

/* =========================================================
   商会会员撮合系统 · 单文件版
   数据保存在浏览器 localStorage，刷新不丢失。
   安全提示：本文件为纯前端实现，数据仅存储在当前浏览器，
   请勿用于承载真实敏感商业信息。

/* ---------- 常量与工具 ---------- */
var LS_KEY='cc_sys_v1';
var SESSION_KEY='cc_session_v1';
var CATEGORIES=['电子元器件','办公家具','物流服务','餐饮食品','纺织服装','机械设备','软件服务','包装印刷','建材家居','其他'];

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function nowISO(){return new Date().toISOString();}
function randSalt(){var a=new Uint8Array(8);if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);}else{for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);}return Array.from(a).map(function(b){return b.toString(16).padStart(2,'0');}).join('');}
function fmtDate(iso){if(!iso)return '-';var d=new Date(iso);if(isNaN(d))return '-';function p(n){return String(n).padStart(2,'0');}return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function fmtDateShort(iso){if(!iso)return '-';var d=new Date(iso);if(isNaN(d))return '-';function p(n){return String(n).padStart(2,'0');}return p(d.getMonth()+1)+'-'+p(d.getDate());}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthKey(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function dayKeyOf(iso){var d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* ---------- Toast ---------- */
function toast(msg,type){var box=document.getElementById('toast');var el=document.createElement('div');el.className='toast-item'+(type?' '+type:'');el.textContent=msg;box.appendChild(el);requestAnimationFrame(function(){el.classList.add('show');});setTimeout(function(){el.classList.remove('show');setTimeout(function(){el.remove();},250);},2600);}

/* ---------- 密码哈希（PBKDF2，失败时降级为加盐散列） ---------- */
async function hashPassword(pw,salt){
  var enc=new TextEncoder();
  if(window.crypto&&crypto.subtle){
    try{
      var key=await crypto.subtle.importKey('raw',enc.encode(String(pw)),{name:'PBKDF2'},false,['deriveBits']);
      var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(String(salt)),iterations:10000,hash:'SHA-256'},key,256);
      return Array.from(new Uint8Array(bits)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    }catch(e){}
  }
  var h=5381,s=salt+':'+pw;
  for(var i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}
  return 'fb'+h.toString(16);
}

/* ---------- 密码强度规则（6-8位，必须含数字、大写、小写字母） ---------- */
function pwdValid(p){
  if(typeof p!=='string')return false;
  if(p.length<6||p.length>8)return false;
  if(!/[0-9]/.test(p))return false;
  if(!/[a-z]/.test(p))return false;
  if(!/[A-Z]/.test(p))return false;
  return true;
}
function pwdHint(){return '密码需6-8位，且必须同时包含数字、大写字母和小写字母';}

/* ---------- 数据层 ---------- */
var DB=null;
function normalizeDB(d){
  if(!d)return null;
  d.contactReqs=d.contactReqs||[];
  d._meta=d._meta||{};
  if(d._meta.chiefAuthed===undefined){d._meta.chiefAuthed=d.users.some(function(u){return u.position==='会长'&&u.role==='admin'&&u.createdBy!=='system';});}
  if(d.matches){d.matches.forEach(function(mt){if(mt.status==='confirmed'&&!mt.contract){mt.contract={no:mt.contractNo||('HT-'+stamp8()+'-'+rand4()),status:'draft',clauses:defaultClauses(),notes:'',createdAt:mt.contractAt||mt.matchedAt};mt.contractNo=mt.contractNo||mt.contract.no;mt.contractAt=mt.contractAt||mt.contract.createdAt;}});}
  return d;
}
function load(){try{var raw=localStorage.getItem(LS_KEY);if(raw){var d=JSON.parse(raw);if(d&&d.users&&d.posts&&d.matches)return normalizeDB(d);}}catch(e){}return null;}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(DB));}

async function ensureSeed(){
  if(load()){DB=load();return;}
  var salt=randSalt();
  var h=await hashPassword('123456',salt);
  var t=nowISO();
  var admin={id:'u_admin',username:'admin',role:'admin',name:'商会会长',gender:'',position:'会长',company:'',phone:'',wechat:'',email:'',city:'',industry:'',status:'active',createdBy:'system',salt:salt,passHash:h,createdAt:t};
  DB={users:[admin],posts:[],matches:[],contactReqs:[],_meta:{chiefAuthed:false}};
  recomputeAll();
  save();
}

/* ---------- 匿名规则 ---------- */
function displayNameOf(u){if(!u)return '某会员';if(u.gender==='男')return '某某先生';if(u.gender==='女')return '某某女士';return '某会员';}
function publicUser(u){return u?{id:u.id,name:'',displayName:displayNameOf(u),gender:u.gender,city:u.city,industry:u.industry}:null;}
function realNameOf(u){return u?u.name:'-';}

/* ---------- 撮合引擎 ---------- */
function kwList(p){return (p.keywords||[]).map(function(k){return String(k).trim().toLowerCase();}).filter(Boolean);}
function matchBetween(demand,supply){
  if(!demand||!supply)return null;
  if(demand.type!=='demand'||supply.type!=='supply')return null;
  if(demand.userId===supply.userId)return null;
  if(demand.category!==supply.category)return null;
  if(demand.status!=='active'||supply.status!=='active')return null;
  var dk=kwList(demand),sk=kwList(supply);
  var dText=(demand.title+' '+(demand.description||'')).toLowerCase();
  var sText=(supply.title+' '+(supply.description||'')).toLowerCase();
  var hits=[];
  for(var i=0;i<dk.length;i++){if(sk.indexOf(dk[i])>-1||sText.indexOf(dk[i])>-1){if(hits.indexOf(dk[i])<0)hits.push(dk[i]);}}
  for(var j=0;j<sk.length;j++){if(dText.indexOf(sk[j])>-1&&hits.indexOf(sk[j])<0)hits.push(sk[j]);}
  if(hits.length===0)return null;
  return {matchedKeywords:hits,score:hits.length};
}
function recomputeAll(){
  if(!DB)return;
  var demands=DB.posts.filter(function(p){return p.type==='demand'&&p.status==='active';});
  var supplies=DB.posts.filter(function(p){return p.type==='supply'&&p.status==='active';});
  var activeKeys={};
  demands.forEach(function(d){
    supplies.forEach(function(s){
      var m=matchBetween(d,s);
      if(!m)return;
      var k=d.id+'|'+s.id;activeKeys[k]=1;
      var ex=DB.matches.find(function(x){return x.demandPostId===d.id&&x.supplyPostId===s.id;});
      if(ex){
        if(ex.status!=='active'){ex.status='active';ex.matchedAt=nowISO();}
        if(JSON.stringify(ex.matchedKeywords)!==JSON.stringify(m.matchedKeywords)){ex.matchedKeywords=m.matchedKeywords;ex.score=m.score;ex.matchedAt=nowISO();}
      }else{
        DB.matches.push({id:uid(),demandPostId:d.id,supplyPostId:s.id,demandUserId:d.userId,supplyUserId:s.userId,category:d.category,matchedKeywords:m.matchedKeywords,score:m.score,status:'active',matchedAt:nowISO()});
      }
    });
  });
  DB.matches.forEach(function(mt){if(mt.status==='active'&&!activeKeys[mt.demandPostId+'|'+mt.supplyPostId])mt.status='invalid';});
  save();
}

    shield:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg>',

async function doRegister(e){
  e.preventDefault();
  var ts=trialStatus();
  if(!ts.ok){toast(ts.msg,'err');return false;}
  function v(id){return document.getElementById(id).value.trim();}
  var acct=v('rg_acct'),pwd=v('rg_pwd'),pwd2=v('rg_pwd2'),name=v('rg_name'),gender=v('rg_gender'),position=v('rg_position'),city=v('rg_city'),company=v('rg_company'),phone=v('rg_phone'),wechat=v('rg_wechat'),industry=v('rg_industry');
  if(!/^[A-Za-z0-9_]{3,20}$/.test(acct)){toast('账号需为3-20位字母、数字或下划线','err');return false;}
  if(DB.users.some(function(x){return x.username.toLowerCase()===acct.toLowerCase();})){toast('该账号已被注册','err');return false;}
  if(!pwdValid(pwd)){toast(pwdHint(),'err');return false;}
  if(pwd!==pwd2){toast('两次输入的密码不一致','err');return false;}
  if(!name){toast('请填写真实姓名','err');return false;}
  if(!/^1\d{10}$/.test(phone)){toast('请填写正确的11位手机号','err');return false;}
  if(position==='会长'&&!isChiefAuthed()){
    var code=v('rg_code');
    if(code!==CHIEF_AUTH_CODE){openChiefCodeModal();return false;}
  }
  var salt=randSalt();
  var h=await hashPassword(pwd,salt);
  var isChief=position==='会长';
  DB.users.push({id:uid(),username:acct,role:isChief?'admin':'member',passHash:h,salt:salt,name:name,gender:gender,position:position,company:company,phone:phone,wechat:wechat,email:'',city:city,industry:industry,status:isChief?'active':'pending',createdAt:nowISO(),createdBy:'self'});
  if(isChief){DB._meta=DB._meta||{};DB._meta.chiefAuthed=true;}
  save();
  toast(isChief?'注册成功，您为商会会长（超级账号），可直接登录':'注册成功，待商会会长审核通过后即可登录','ok');
  location.hash='#/login';
  return false;
}

function cancelEditPost(){editingPostId=null;render();}

function savePost(){
  var type=document.getElementById('pf_type').value;
  var cat=document.getElementById('pf_cat').value;
  var title=document.getElementById('pf_title').value.trim();
  var desc=document.getElementById('pf_desc').value.trim();
  var kwsRaw=document.getElementById('pf_kws').value;
  var kws=kwsRaw.split(/[,，、;；\s]+/).map(function(k){return k.trim();}).filter(Boolean);
  if(!cat){toast('请选择所属分类','err');return;}
  if(title.length<2){toast('请填写标题','err');return;}
  if(kws.length===0){toast('请至少填写一个关键词（用于撮合匹配）','err');return;}
  var u=currentUser();
  if(editingPostId){
    var p=DB.posts.find(function(x){return x.id===editingPostId;});
    if(p){p.type=type;p.category=cat;p.title=title;p.description=desc;p.keywords=kws;p.updatedAt=nowISO();}
    editingPostId=null;
    toast('信息已更新，撮合结果已重新计算','ok');
  }else{
    DB.posts.push({id:uid(),userId:u.id,type:type,category:cat,title:title,description:desc,keywords:kws,status:'active',createdAt:nowISO(),updatedAt:nowISO()});
    toast('发布成功，系统已开始自动撮合','ok');
  }
  recomputeAll();
  render();
}
function togglePost(id){
  var p=DB.posts.find(function(x){return x.id===id;});
  if(!p)return;
  p.status=p.status==='active'?'off':'active';
  p.updatedAt=nowISO();
  recomputeAll();
  toast(p.status==='active'?'已重新上架':'已下架');
  render();
}
function delPost(id){
  var p=DB.posts.find(function(x){return x.id===id;});
  if(!p)return;
  if(!confirm('确定删除该信息？相关撮合记录将一并失效。'))return;
  DB.posts=DB.posts.filter(function(x){return x.id!==id;});
  recomputeAll();
  toast('已删除');
  render();
}

/* ---------- 我的撮合（含确认交易 · 自动合同 · 联系会长） ---------- */
function myConfirmState(m,u){
  var mySide=m.demandUserId===u.id;
  return {myConfirmed:!!(mySide?m.confirmA:m.confirmB),otherConfirmed:!!(mySide?m.confirmB:m.confirmA),done:m.status==='confirmed'};
}
function myContactReq(m,u){return (DB.contactReqs||[]).find(function(r){return r.matchId===m.id&&r.requesterId===u.id;});}
function otherContactGranted(m,u){return !!(DB.contactReqs||[]).find(function(r){return r.matchId===m.id&&r.requesterId===u.id&&r.status==='granted';});}
function contactBlockOf(other){
  if(!other)return '';
  return '<div class="contact-grant">'+icon('user')+'<b>'+esc(other.name)+'</b>　'+esc(other.company||'')+'<br>手机：'+esc(other.phone||'-')+'　微信：'+esc(other.wechat||'-')+'<div style="font-size:12px;opacity:.75;margin-top:3px">经商会会长审核授权后可见</div></div>';
}
function memberMatchActions(m){
  var u=currentUser();
  var bits='';
  if(m.status==='active'){
    var st=myConfirmState(m,u);
    if(st.myConfirmed)bits+='<span class="badge badge-active">我方已确认 · 待对方确认</span>';
    else bits+='<button class="btn btn-primary btn-sm" onclick="confirmMyMatch(\''+m.id+'\')">确认交易</button>';
    if(st.otherConfirmed)bits+='<span class="badge badge-pending">对方已确认</span>';
  }else if(m.status==='confirmed'){
    bits+='<span class="badge badge-active">交易已达成</span>'+
      (m.contract&&m.contract.status==='sent'?'<span class="badge badge-active">合同已发送 · 请查收</span>':'<span class="badge badge-pending">合同待会长发送</span>')+
      '<button class="btn btn-gold btn-sm" onclick="contractModal(\''+m.id+'\')">'+icon('file')+'查看合同</button>';
  }
  var req=myContactReq(m,u);
  if(m.status!=='invalid'){
    if(!req){bits+='<button class="btn btn-ghost btn-sm" onclick="requestContact(\''+m.id+'\')">'+icon('mail')+'联系会长获取对方联系方式</button>';}
    else if(req.status==='pending'){bits+='<span class="badge badge-pending">联系申请审核中</span>';}
    else if(req.status==='rejected'){bits+='<span class="badge badge-invalid">联系申请未通过</span>';}
  }
  var out='<div class="match-actions">'+bits+'</div>';
  if(req&&req.status==='granted'){
    var other=DB.users.find(function(x){return x.id===(m.demandUserId===u.id?m.supplyUserId:m.demandUserId);});
    out+=contactBlockOf(other);
  }
  return out;
}

var chartA=null,chartB=null,chartC=null;
function initCharts(){
  var elA=document.getElementById('chartA'),elB=document.getElementById('chartB'),elC=document.getElementById('chartC');
  if(!elA||!elB||!elC)return;
  if(!window.echarts){
    fallbackCharts(elA,elB,elC);
    var s=document.createElement('script');
    s.src=window.__echartsScript||'https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js';
    s.onload=function(){try{initCharts();}catch(e){}};
    s.onerror=function(){};
    document.head.appendChild(s);
    return;
  }
  if(chartA)chartA.dispose();if(chartB)chartB.dispose();if(chartC)chartC.dispose();
  chartA=echarts.init(elA);chartB=echarts.init(elB);chartC=echarts.init(elC);
  var catNames=[],catDemand=[],catSupply=[];
  CATEGORIES.forEach(function(c){
    var d=DB.posts.filter(function(p){return p.status==='active'&&p.category===c&&p.type==='demand';}).length;
    var s=DB.posts.filter(function(p){return p.status==='active'&&p.category===c&&p.type==='supply';}).length;
    if(d||s){catNames.push(c);catDemand.push(d);catSupply.push(s);}
  });
  chartA.setOption({
    color:['#B5472F','#1F7A4D'],
    tooltip:{trigger:'axis'},
    legend:{data:['需求','供应'],textStyle:{color:'#66748A',fontSize:12}},
    grid:{left:8,right:8,top:34,bottom:8,containLabel:true},
    xAxis:{type:'category',data:catNames,axisLine:{lineStyle:{color:'#D8DEE8'}},axisLabel:{color:'#66748A',fontSize:11}},
    yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#EEF1F6'}},axisLabel:{color:'#66748A'}},
    series:[{name:'需求',type:'bar',data:catDemand,barMaxWidth:18,itemStyle:{borderRadius:[3,3,0,0]}},{name:'供应',type:'bar',data:catSupply,barMaxWidth:18,itemStyle:{borderRadius:[3,3,0,0]}}]
  });
  var mcat=[],mcnt=[];
  var mByCat={};
  DB.matches.filter(function(m){return m.status==='active';}).forEach(function(m){mByCat[m.category]=(mByCat[m.category]||0)+1;});
  CATEGORIES.forEach(function(c){if(mByCat[c]){mcat.push(c);mcnt.push(mByCat[c]);}});
  chartB.setOption({
    color:['#B8934A'],
    tooltip:{trigger:'axis'},
    grid:{left:8,right:8,top:24,bottom:8,containLabel:true},
    xAxis:{type:'category',data:mcat,axisLine:{lineStyle:{color:'#D8DEE8'}},axisLabel:{color:'#66748A',fontSize:11}},
    yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#EEF1F6'}},axisLabel:{color:'#66748A'}},
    series:[{name:'撮合数',type:'bar',data:mcnt,barMaxWidth:22,itemStyle:{borderRadius:[3,3,0,0]}}]
  });
  var days=[],cnt=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    function p(n){return String(n).padStart(2,'0');}
    var key=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    days.push(p(d.getMonth()+1)+'-'+p(d.getDate()));
    cnt.push(DB.matches.filter(function(m){return dayKeyOf(m.matchedAt)===key;}).length);
  }
  chartC.setOption({
    color:['#24508F'],
    tooltip:{trigger:'axis'},
    grid:{left:8,right:8,top:24,bottom:8,containLabel:true},
    xAxis:{type:'category',data:days,axisLine:{lineStyle:{color:'#D8DEE8'}},axisLabel:{color:'#66748A',fontSize:11}},
    yAxis:{type:'value',minInterval:1,splitLine:{lineStyle:{color:'#EEF1F6'}},axisLabel:{color:'#66748A'}},
    series:[{name:'撮合数',type:'bar',data:cnt,barMaxWidth:26,itemStyle:{borderRadius:[3,3,0,0]}}]
  });
}
function fallbackCharts(elA,elB,elC){
  function bar(el,labels,vals,color){
    var max=Math.max.apply(null,vals.concat([1]));
    el.innerHTML='<div class="fb-bar">'+labels.map(function(l,i){return '<div class="fb-col"><div class="fb-v">'+vals[i]+'</div><div class="fb-b" style="height:'+Math.round(vals[i]/max*100)+'%;background:'+color+'"></div><div class="fb-l" title="'+esc(l)+'">'+esc(l)+'</div></div>';}).join('')+'</div>';
  }
  var cn=[],cd=[],cs=[];
  CATEGORIES.forEach(function(c){var d=DB.posts.filter(function(p){return p.status==='active'&&p.category===c&&p.type==='demand';}).length;var s=DB.posts.filter(function(p){return p.status==='active'&&p.category===c&&p.type==='supply';}).length;if(d||s){cn.push(c);cd.push(d);cs.push(s);}});
  bar(elA,cn,cd.map(function(_,i){return cd[i]+cs[i];}),'#24508F');
  var mcat=[],mcnt=[];var mByCat={};
  DB.matches.filter(function(m){return m.status==='active';}).forEach(function(m){mByCat[m.category]=(mByCat[m.category]||0)+1;});
  CATEGORIES.forEach(function(c){if(mByCat[c]){mcat.push(c);mcnt.push(mByCat[c]);}});
  bar(elB,mcat,mcnt,'#B8934A');
  var days=[],cnt=[];
  for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);function p(n){return String(n).padStart(2,'0');}var key=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());days.push(p(d.getMonth()+1)+'-'+p(d.getDate()));cnt.push(DB.matches.filter(function(m){return dayKeyOf(m.matchedAt)===key;}).length);}
  bar(elC,days,cnt,'#24508F');
}

function stamp8(){var d=new Date();function p(n){return (n<10?'0':'')+n;}return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());}
function rand4(){var s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r='';for(var i=0;i<4;i++)r+=s.charAt(Math.floor(Math.random()*s.length));return r;}
function defaultClauses(){return [
  '一、甲乙双方已通过商会撮合系统确认本次交易意向，本合同为撮合意向确认凭证。',
  '二、双方应就价格、数量、交付方式等商务条款另行协商，并签订正式购销合同。',
  '三、双方应诚信履约；发生争议时，可提请商会秘书处协调解决。',
  '四、本合同经商会秘书处审定并发送至双方账号后生效，由商会秘书处备案留存。'
];}
function contractStatusBadge(m){var c=m&&m.contract;if(!c)return '';return c.status==='sent'?'<span class="badge badge-active">合同已发送</span>':'<span class="badge badge-pending">合同待发送</span>';}
function confirmMyMatch(id){
  var u=currentUser();if(!u)return;
  var m=DB.matches.find(function(x){return x.id===id;});
  if(!m){toast('撮合记录不存在','err');return;}
  if(m.demandUserId!==u.id&&m.supplyUserId!==u.id){toast('仅撮合参与方可确认交易','err');return;}
  if(m.status!=='active'){toast('当前状态不可确认交易','err');return;}
  var key=m.demandUserId===u.id?'confirmA':'confirmB';
  if(m[key]){toast('你已确认过本次交易','err');return;}
  m[key]={by:u.id,at:nowISO()};
  if(m.confirmA&&m.confirmB){
    m.status='confirmed';
    m.contract={no:'HT-'+stamp8()+'-'+rand4(),status:'draft',clauses:defaultClauses(),notes:'',createdAt:nowISO()};
    m.contractNo=m.contract.no;
    m.contractAt=m.contract.createdAt;
    save();
    toast('双方已确认交易，撮合合同已自动生成，待商会会长审定后发送','ok');
  }else{
    save();
    toast('你已确认交易，等待对方确认','ok');
  }
  render();
}

function saveContract(mid,send){
  var m=DB.matches.find(function(x){return x.id===mid;});
  if(!m){toast('撮合记录不存在','err');return;}
  var c=m.contract;if(!c){toast('合同不存在','err');return;}
  var cls=[];
  for(var i=0;i<c.clauses.length;i++){
    var el=document.getElementById('ct_clause_'+i);
    if(el&&el.value.trim())cls.push(el.value.trim());
  }
  var notesEl=document.getElementById('ct_notes');
  c.clauses=cls.length?cls:c.clauses;
  c.notes=notesEl?notesEl.value.trim():c.notes||'';
  if(send){c.status='sent';c.sentAt=nowISO();}
  else if(c.status!=='sent'){c.status='draft';}
  save();
  closeModal();
  toast(send?'合同已保存并发送至交易双方账号':'合同修改已保存','ok');
  render();
}
function sendContract(mid){
  var m=DB.matches.find(function(x){return x.id===mid;});

  var c=m.contract;if(!c){toast('合同不存在','err');return;}
  if(c.status==='sent'){toast('合同已发送，无需重复发送','err');return;}
  if(!confirm('确定将合同 '+c.no+' 发送至交易双方账号？'))return;

  save();toast('合同已发送至交易双方账号','ok');render();
}

function recordSig(r){
  var keys=Object.keys(r).sort();
  return keys.map(function(k){return k+'='+JSON.stringify(r[k]);}).join('|');
}
function counts(d){return {users:(d.users||[]).length,posts:(d.posts||[]).length,matches:(d.matches||[]).length,contactReqs:(d.contactReqs||[]).length};}
function logBk(type,no,cnts){
  DB._meta=DB._meta||{};
  DB._meta.bkLog=DB._meta.bkLog||[];
  DB._meta.bkLog.unshift({type:type,no:no,time:nowISO(),users:cnts.users,posts:cnts.posts,matches:cnts.matches,contactReqs:cnts.contactReqs});
  if(DB._meta.bkLog.length>30)DB._meta.bkLog.length=30;
  save();
}
function buildFullBackup(){
  var no='BK-F-'+stamp8()+'-'+rand4();
  var data={users:DB.users,posts:DB.posts,matches:DB.matches,contactReqs:DB.contactReqs||[]};
  data=JSON.parse(JSON.stringify(data));
  var baseline={};
  [DB.users,DB.posts,DB.matches,DB.contactReqs||[]].forEach(function(arr){arr.forEach(function(r){baseline[r.id]=recordSig(r);});});
  DB._meta=DB._meta||{};
  DB._meta.lastFullBackupAt=nowISO();
  DB._meta.lastFullBackupNo=no;
  DB._meta.baseline=baseline;
  save();
  return {app:'cc_sys',version:1,type:'full',backupNo:no,backupTime:nowISO(),meta:JSON.parse(JSON.stringify(DB._meta||{})),data:data};
}
function buildDiffBackup(){
  var meta=DB._meta||{};
  var baseline=meta.baseline||{};
  var changed={users:[],posts:[],matches:[],contactReqs:[]};
  function diff(arr,target){arr.forEach(function(r){var sig=recordSig(r);if(!baseline[r.id]||baseline[r.id]!==sig)target.push(r);});}
  diff(DB.users,changed.users);
  diff(DB.posts,changed.posts);
  diff(DB.matches,changed.matches);
  diff(DB.contactReqs||[],changed.contactReqs);
  return {app:'cc_sys',version:1,type:'diff',backupNo:'BK-D-'+stamp8()+'-'+rand4(),backupTime:nowISO(),baseNo:meta.lastFullBackupNo||'',baseTime:meta.lastFullBackupAt||'',data:JSON.parse(JSON.stringify(changed))};
}

function doBackup(type){
  var u=currentUser();if(!u||u.role!=='admin'){toast('仅会长账号可使用备份功能','err');return;}
  var obj=type==='full'?buildFullBackup():buildDiffBackup();
  var cnt=counts(obj.data);
  logBk(obj.type,obj.backupNo,cnt);
  var json=JSON.stringify(obj,null,2);
  var fname='商会会员撮合系统_'+obj.backupNo+'.json';
  var label=obj.type==='full'?'全备份':'差异备份';
  if(typeof window.showSaveFilePicker==='function'){
    window.showSaveFilePicker({
      suggestedName:fname,
      types:[{description:'JSON 备份文件',accept:{'application/json':['.json']}}]
    }).then(function(handle){
      return handle.createWritable().then(function(w){
        return w.write(json).then(function(){return w.close();});
      });
    }).then(function(){
      toast(label+'已完成：'+obj.backupNo+'，已保存到你选择的位置（桌面/D盘/E盘等）','ok');
    }).catch(function(e){
      if(e&&e.name==='AbortError'){toast('已取消保存','err');}
      else{fallbackDownload(json,fname,label,obj.backupNo);}
    });
  }else{
    fallbackDownload(json,fname,label,obj.backupNo);
  }
}
function fallbackDownload(json,fname,label,no){
  try{
    var blob=new Blob([json],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;
    a.download=fname;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){try{URL.revokeObjectURL(url);}catch(e){}},4000);
    toast((label||'备份')+'已完成：'+(no||'')+'，文件已保存到浏览器默认的下载文件夹，可在下载文件夹中找到后移动到 桌面/D盘/E盘','ok');
  }catch(e){toast('备份导出失败：'+e.message,'err');}
}

function handleRestoreFile(input){
  var f=input&&input.files&&input.files[0];
  if(!f)return;
  var u=currentUser();if(!u||u.role!=='admin'){toast('仅会长账号可使用恢复功能','err');input.value='';return;}
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var obj=JSON.parse(ev.target.result);
      var kind=(obj&&obj.app==='cc_sys'&&obj.type==='diff')?'diff':'full';
      var d=obj&&obj.data?obj.data:obj;
      if(!d||!d.users||!d.posts||!d.matches)throw new Error('文件内容不是有效的系统备份');
      var msg=kind==='diff'
        ?'差异备份【'+(obj.backupNo||'')+'】将按编号合并新增/更新数据，不会删除现有数据。确定继续？'
        :'全量恢复将覆盖当前系统中的全部数据（会员、供需信息、撮合记录、合同等）。确定继续？';
      if(!confirm(msg)){input.value='';return;}
      if(kind==='diff'){
        function mergeInto(curArr,arr){arr.forEach(function(r){if(!r||!r.id)return;var i=curArr.findIndex(function(x){return x.id===r.id;});if(i>-1)curArr[i]=r;else curArr.push(r);});}
        mergeInto(DB.users,d.users||[]);
        mergeInto(DB.posts,d.posts||[]);
        mergeInto(DB.matches,d.matches||[]);
        DB.contactReqs=DB.contactReqs||[];
        mergeInto(DB.contactReqs,d.contactReqs||[]);
        normalizeDB(DB);
        save();
        toast('差异恢复成功：新增/更新 用户 '+(d.users||[]).length+'、供需信息 '+(d.posts||[]).length+'、撮合 '+(d.matches||[]).length+'、联系申请 '+(d.contactReqs||[]).length,'ok');
      }else{
        normalizeDB(d);
        if(obj&&obj.app==='cc_sys'&&obj.meta&&typeof obj.meta==='object')d._meta=obj.meta;else d._meta=d._meta||{};
        DB=d;
        save();
        toast('数据恢复成功，页面数据已更新','ok');
      }
      if(session&&!currentUser()){clearSession();}
      render();
    }catch(e){
      toast('恢复失败：'+(e&&e.message?e.message:'文件格式不正确'),'err');
    }
    if(input)input.value='';
  };
  reader.onerror=function(){toast('读取备份文件失败','err');};
  reader.readAsText(f);
}

  var h=location.hash||'#/login';

    app.innerHTML=loginView();fillStars();return;
  }

  if(h.startsWith('#/member')){

    else if(sec==='profile'){app.innerHTML=memberLayout('profile','我的资料',profileView());}
    else if(sec==='pw'){app.innerHTML=memberLayout('pw','修改密码',memberPwView());}
    else{location.hash='#/member/dashboard';}
  }else if(h.startsWith('#/admin')){
    if(u.role!=='admin'){location.hash='#/member/dashboard';return;}
    var sec2=h.replace('#/admin/','')||'dashboard';
    if(sec2==='dashboard'){app.innerHTML=adminLayout('dashboard','数据统计看板',adminDashboardView());setTimeout(initCharts,0);startAdminTimer();}

  }
}

window.addEventListener('resize',function(){if(chartA)chartA.resize();if(chartB)chartB.resize();if(chartC)chartC.resize();});
(async function init(){
  try{
    await ensureSeed();
  }catch(e){
    toast('初始化数据失败：'+e.message,'err');
  }
  render();
})();
</script>
